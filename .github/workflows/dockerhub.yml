name: dockerhub

# Set Docker Hub's short description and overview: this README with its
# version block filled in from the published image. The nightly calls it
# after publishing; it also runs alone when the README changes, so a docs fix
# reaches Docker Hub in a minute rather than waiting for the next build.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/dockerhub.yml]

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository's README is untouched; only the copy sent is filled in
      - name: Write Docker Hub overview
        run: |
          docker pull --quiet deanturpin/gcc:latest
          {
            echo '```bash'
            echo '$ date'
            date -u
            echo
            echo '$ docker run deanturpin/gcc g++ --version'
            # g++ ends with a blank line, which would show inside the fence
            docker run --rm deanturpin/gcc:latest g++ --version | sed '/^$/d'
            echo '```'
          } > "$RUNNER_TEMP/version.md"
          python3 - "$RUNNER_TEMP/version.md" "$RUNNER_TEMP/README.md" <<'PY'
          import re, sys
          block = open(sys.argv[1]).read()
          readme = open("README.md").read()
          readme = re.sub(r"(<!-- version -->\n).*?(<!-- /version -->)",
                          lambda m: m[1] + block + m[2], readme, flags=re.S)
          open(sys.argv[2], "w").write(readme)
          PY

      # Editing the description needs a token with Read, Write, Delete
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: deanturpin/gcc
          readme-filepath: ${{ runner.temp }}/README.md
          short-description: GCC trunk built from source every night for amd64 and arm64, C++ only, on Ubuntu 24.04
