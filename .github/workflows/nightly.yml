name: nightly

# Build GCC from the tip of trunk every night, for amd64 and arm64 on native
# runners, and publish it to Docker Hub as deanturpin/gcc:latest, plus a
# dated tag so older snapshots stay pullable.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/nightly.yml]
  # A pull request builds and tests the image but never publishes it
  pull_request:
    paths: [Dockerfile, .github/workflows/nightly.yml]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: deanturpin/gcc

jobs:
  # Pin one trunk commit and date for every architecture, so both halves of
  # the image are the same compiler even if trunk moves mid-build
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gcc.outputs.sha }}
      date: ${{ steps.gcc.outputs.date }}
    steps:
      # The commit also busts Docker's layer cache for the clone, which would
      # otherwise rebuild the same old source forever
      - id: gcc
        run: |
          echo "sha=$(git ls-remote https://gcc.gnu.org/git/gcc.git refs/heads/master | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build into the runner's Docker first, so a compiler that can't build
      # and run a program is never published
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          build-args: GCC_COMMIT=${{ needs.resolve.outputs.sha }}
          tags: gcc:test

      - name: Smoke test
        run: |
          docker run --rm gcc:test g++ --version
          docker run --rm gcc:test sh -c 'make --version && cmake --version && ninja --version' | grep -i version
          test "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' gcc:test)" = "${{ needs.resolve.outputs.sha }}"
          printf '#include <print>\nint main() { std::println("hello from {}", __VERSION__); }\n' > hello.cxx
          docker run --rm -v "$PWD:/w" -w /w gcc:test \
            sh -c 'g++ -std=c++26 hello.cxx -o hello && ./hello'

      # The same build again, from the cache, pushed by digest only; the
      # merge job gives the two architectures their tags together
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: GCC_COMMIT=${{ needs.resolve.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # Tag both architectures as one image, once both have passed
  publish:
    needs: [resolve, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag latest and the date
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:${{ needs.resolve.outputs.date }}" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"

  # Docker Hub's summary and overview, refreshed from the image just published
  overview:
    needs: publish
    uses: ./.github/workflows/dockerhub.yml
    secrets: inherit
